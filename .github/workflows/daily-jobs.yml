name: Daily job refresh

on:
  schedule:
    # 00:00 UTC daily ≈ 08:00 SGT
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install deps
        run: npm install

      - name: Run job discovery script
        run: node scripts/fetch-jobs.mjs
        env:
          REMOTEOK_ENABLED: "true"
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          JOBSPIPE_API_KEY: ${{ secrets.JOBSPIPE_API_KEY }}

      - name: Commit and push updated jobs
        run: |
          git config user.name "hirehired-bot"
          git config user.email "bot@hirehired.local"
          git add src/data/jobs.json
          if git diff --staged --quiet; then
            echo "No job data changes"
            exit 0
          fi
          git commit -m "chore: daily job refresh $(date -u +%Y-%m-%d)"
          # Avoid race with concurrent pushes (deploy / manual commits)
          git pull --rebase origin main || git pull --rebase --autostash origin main
          git push origin main
